<!doctype html>
<html lang="es">
<head>
<meta http-equiv="Content-Security-Policy" content="script-src 'self'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
<title>Experiencia - GuateGeeks Code Studio</title>
<link rel="icon" href="docs/static/gg-favicon.png">
<link rel="stylesheet" href="studio.css">
<style>
html,body{overflow:hidden;background:var(--plum-dark)}
#player-bar{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:10px;padding:4px 12px;background:var(--cream);border-bottom:1.5px solid var(--line);z-index:2}
#player-bar button{min-height:40px;padding:4px 14px}
#player-error{position:fixed;inset:52px 0 auto 0;margin:0;padding:16px;background:var(--error-paper);z-index:2}
#sim{position:fixed;inset:52px 0 0 0}
#sim .simframe{position:absolute!important;inset:0;padding:0!important;width:100%;height:100%}
#sim iframe{position:absolute;inset:0;width:100%!important;height:100%!important;border:0;display:block}
#sim .ui.active.loader,#sim i.videoplay{display:none!important}
</style>
</head>
<body data-estado="cargando">
<nav id="player-bar" aria-label="Experiencia">
  <button type="button" id="player-back">Volver a Experiencias</button>
  <button type="button" id="player-again">Jugar otra vez</button>
  <button type="button" id="player-code">Ver cómo está hecho</button>
</nav>
<p id="player-error" role="alert" hidden></p>
<div id="sim" tabindex="-1"></div>
<script src="pxtsim.js"></script>
<script type="module" src="player.mjs"></script>
</body>
</html>
