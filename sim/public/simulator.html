<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escenario</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block;overflow:hidden;background:#321853}</style>
</head>
<body>
<iframe id="stage" title="Escenario" sandbox="allow-scripts" allow="autoplay"></iframe>
<script>
// Student code runs only in the opaque inner frame. It is built inline because
// sandboxed frames bypass the service worker and could not load offline otherwise.
const stage = document.getElementById('stage');
addEventListener('message', event => {
  if (event.source === stage.contentWindow) parent.postMessage(event.data, '*');
  else if (event.source === parent) stage.contentWindow.postMessage(event.data, '*');
});
addEventListener('focus', () => stage.focus());
const read = file => fetch(new URL(file, location.href)).then(response => response.text());
const inline = code => '<script>' + code.replace(/<\/script/gi, '<\\/script') + '</' + 'script>';
Promise.all([read('sim-inner.html'), read('pxtsim.js'), read('sim.js')]).then(([html, runtime, game]) => {
  stage.srcdoc = html
    .replace('<script src="pxtsim.js"></' + 'script>', () => inline(runtime))
    .replace('<script src="sim.js"></' + 'script>', () => inline(game))
    .replace('<head>', () => '<head>' + inline('location.hash=' + JSON.stringify(location.hash)));
});
</script>
</body>
</html>
